# ego-lite-windows-skill bundle patch — one insert over the profile root.
#
# Row ids are stable identity in the config tree; later layers override a row by
# id, replacing the whole `config` (no deep merge). `enabled: false` disables the
# skill registration for this profile without uninstalling the package.

- insert:
    - id: ego-lite-windows
      name: 'dsh-ego-lite-windows-skill'
      config:
        enabled: true
